name: CI

on:
  pull_request:
    branches: ['master', 'main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint -- --fix && git diff --exit-code || echo "Lint auto-fixed some files"
        continue-on-error: true

      - name: Unit tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat coverage/my-shop/coverage-summary.json | node -e "
            const data = require('fs').readFileSync(0, 'utf8');
            const json = JSON.parse(data);
            console.log(json.total.statements.pct);
          ")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "Coverage is below 50% threshold"
            exit 1
          fi
        continue-on-error: true

      - name: Build
        run: npm run build

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook
